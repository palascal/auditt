name: AudiTT Scraper

# Disabled: AudiTT / AutoScout Telegram alerts are retired.
# Workflow kept disabled; no schedule, no Telegram secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditt-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired
        run: |
          echo "AudiTT scraper and Telegram notifications are retired."
          echo "Re-enable only if you intentionally revive the project."
          exit 1
